[package]
name = "occt-sys"
description = "Static build of the C++ OpenCascade CAD Kernel for use as a Rust dependency (astrakernel M19: self-maintained, OCCT 8.0.1 via OCCT submodule @ V8_0_1)"
authors = ["Brian Schwind <brianmschwind@gmail.com>", "Matěj Laitl <matej@laitl.cz>"]
license = "LGPL-2.1"
version = "8.0.1"
edition = "2021"
repository = "https://github.com/bschwind/opencascade-rs"

# Reduce the crate size so we can publish on crates.io.
# Sorted by file size
exclude = [
    "OCCT/data/*",
    "OCCT/dox/*",
    "OCCT/tests/*",
    "OCCT/samples/*",
    "OCCT/tools/*",
    "OCCT/src/Textures/*",
    "OCCT/src/OpenGl/*",
    "OCCT/src/ViewerTest/*",
    "OCCT/src/QABugs/*",
]

[dependencies]
cmake = "0.1"

# M19：移除空 [workspace] 表——crates.io 发布时代的独立根技巧，
# 在 path-dep 场景下与 fork 工作区形成"multiple workspace roots"冲突。
# 本 crate 经 opencascade-sys 的 build-dependency 进入构建图。
