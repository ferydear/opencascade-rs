[package]
name = "examples"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
opencascade = { version = "0.3", path = "../crates/opencascade", default-features = false }
opencascade-sys = { path = "../crates/opencascade-sys" }
glam = { version = "0.24", features = ["bytemuck"] }
cxx = "1"

[features]
default = ["builtin"]
builtin = ["opencascade/builtin"]

[lib]
name = "examples"
path = "src/lib.rs"

[[bin]]
name = "write_model"
path = "src/write_model.rs"

[[bin]]
name = "m0_validation"
path = "src/m0_validation.rs"
